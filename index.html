<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAYBUDJET</title>
  <!-- SDK Officiel Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #bb86fc;
      --text-main: #ffffff;
      --text-sub: #b0b0b0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background-color: #1a1a1a;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    /* Flèche de retour en haut à gauche */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: background 0.2s;
      z-index: 10;
    }

    .back-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .header {
      text-align: center;
      margin-top: 50px;
    }

    .logo-title {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #bb86fc, #03dac6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #bb86fc;
      color: #000;
    }

    .btn-primary:hover {
      background-color: #9965f4;
    }

    .btn-secondary {
      background-color: #2c2c2c;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: #3d3d3d;
    }

    /* Onglets / Écrans secondaires */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 5;
    }

    .screen.active {
      transform: translateX(0);
    }

    /* Écran Crédits */
    .credit-box {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      border: 1px solid var(--border-color);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .credit-item h3 {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .credit-item p {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Écran Connexion */
    .login-box {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .login-box h2 {
      margin-bottom: 10px;
      font-size: 1.3rem;
    }

    .login-box p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .google-btn-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    /* Écran d'accueil principal (Après Connexion) */
    .test-banner {
      font-size: 3rem;
      font-weight: 900;
      color: #ff4757;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
      animation: pulse 1.5s infinite alternate;
      margin-bottom: 20px;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.05); opacity: 1; }
    }

    .user-welcome {
      font-size: 1.1rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- PAGE D'ACCUEIL INITIALE -->
    <div class="header">
      <h1 class="logo-title">JAYBUDJET</h1>
      <p class="subtitle">Gestion budgétaire simple & intelligente</p>
    </div>

    <div class="button-group">
      <button class="btn btn-primary" id="btn-start">Commencer</button>
      <button class="btn btn-secondary" id="btn-credits">Crédit</button>
    </div>

    <!-- ONGLET 1: CRÉDITS -->
    <div class="screen" id="screen-credits">
      <button class="back-btn" onclick="closeScreen('screen-credits')">&#8592;</button>
      <h2 style="margin-bottom: 30px;">Crédits</h2>
      <div class="credit-box">
        <div class="credit-item">
          <h3>Créateur officiel</h3>
          <p>Jaycob servant</p>
        </div>
        <div class="credit-item">
          <h3>Compagnie / Site web</h3>
          <p>Jay roi</p>
        </div>
      </div>
    </div>

    <!-- ONGLET 2: CONNEXION -->
    <div class="screen" id="screen-login">
      <button class="back-btn" onclick="closeScreen('screen-login')">&#8592;</button>
      <div class="login-box">
        <h2>Connexion requise</h2>
        <p>Veuillez vous connecter avec votre compte Google pour continuer vers <b>JAYBUDJET</b>.</p>
        
        <!-- Vrai Bouton de connexion Google officiel -->
        <div class="google-btn-container">
          <div id="g_id_onload"
               data-client_id="TON_CLIENT_ID_GOOGLE.apps.googleusercontent.com"
               data-callback="handleCredentialResponse">
          </div>
          <div class="g_id_signin" 
               data-type="standard" 
               data-size="large" 
               data-theme="outline" 
               data-text="sign_in_with" 
               data-shape="rectangular" 
               data-logo_alignment="left">
          </div>
        </div>
      </div>
    </div>

    <!-- ONGLET 3: APPLICATION (APRÈS CONNEXION) -->
    <div class="screen" id="screen-dashboard">
      <button class="back-btn" onclick="closeScreen('screen-dashboard')">&#8592;</button>
      <div class="test-banner">EN TEST !</div>
      <p class="user-welcome" id="user-display">Bienvenue dans JAYBUDJET</p>
    </div>

  </div>

  <script>
    const btnStart = document.getElementById('btn-start');
    const btnCredits = document.getElementById('btn-credits');

    // Navigation vers Crédits
    btnCredits.addEventListener('click', () => {
      document.getElementById('screen-credits').classList.add('active');
    });

    // Navigation vers Connexion
    btnStart.addEventListener('click', () => {
      document.getElementById('screen-login').classList.add('active');
    });

    // Fonction pour sortir d'un onglet via la flèche de retour
    function closeScreen(screenId) {
      document.getElementById(screenId).classList.remove('active');
    }

    // Gestionnaire de réponse du vrai système de connexion Google
    function handleCredentialResponse(response) {
      // Décodage simple du jeton JWT renvoyé par Google pour récupérer le nom/prénom
      try {
        const base64Url = response.credential.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        const userData = JSON.parse(jsonPayload);
        document.getElementById('user-display').innerText = `Connecté en tant que : ${userData.name}`;
      } catch (e) {
        document.getElementById('user-display').innerText = `Bienvenue dans JAYBUDJET !`;
      }

      // Fermer l'écran de connexion et ouvrir le Dashboard avec "EN TEST !"
      closeScreen('screen-login');
      document.getElementById('screen-dashboard').classList.add('active');
    }
  </script>
</body>
</html>
